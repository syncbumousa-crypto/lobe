<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لُب — LOBE</title>
<meta name="description" content="لُب — شركةٌ تقنيّة. نُعيد الإنسانَ إلى لُبّه، ليصير منتجًا لا مستهلكًا.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  /* الخطّ: ملفٌّ واحدٌ بوزنٍ واحد — الاسمُ لا يحتاج أكثر.
     و‎block‎ لا ‎swap‎: الاسمُ لا يُعرض بخطٍّ آخرَ لحظةً ثمّ يَقفز. */
  @font-face{
    font-family:"HT Heliopolis"; font-style:normal; font-weight:800; font-display:block;
    src:url("fonts/HT-Heliopolis-Heavy.woff2") format("woff2");
  }

  :root{
    --bg:#fbfaf9; --ink:#1b1a18; --dim:#a6a29b; --line:#e7e4df; --soft:#f3f1ee;
    /* ارتفاعُ الرمز هو وحدةُ القياس: الاسمُ والفُرجةُ محسوبان عليه، فتثبت
       نسبُ القُفل في كلّ شاشةٍ ولا تُضبط مرّتين. */
    --h: clamp(64px, 12vmin, 118px);
    --pad: clamp(22px, 5vw, 64px);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121211; --ink:#f0efec; --dim:#55524d; --line:#26251f; --soft:#191817; }
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"HT Heliopolis","Segoe UI",system-ui,sans-serif;
    font-weight:800; -webkit-font-smoothing:antialiased;
    opacity:0; transition:opacity .5s ease;
  }
  body.ready{ opacity:1; }

  /* ═══ القُفل: الرمزُ ضوءٌ على لوحةٍ خاصّةٍ به، والاسمُ نصٌّ لا صورة ═══ */
  .plate{
    position:relative; overflow:hidden;
    min-height:min(78vh, 720px);
    display:grid; place-items:center; padding:var(--pad);
    /* لونٌ مبدئيّ؛ يُستبدل بلون ركن الحقل نفسِه فيذوب حدُّ القماص فيه.
       ولا تنقلب اللوحةُ مع المظهر: الضوءُ لا يُعكَس. */
    background:#4d7ab5;
  }
  .lock{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:0;
  }
  /* الرمزُ أوّلُ العناصر في الترتيب، فيتقدّم في القراءتين كلتيهما:
     يمينًا في العربيّة ويسارًا في اللاتينيّة، بلا كودٍ إضافيّ.
     والمقاسُ 2.30 لأنّ المعلَمَ يشغل 43.4% من ضلع الحقل، فيصير ارتفاعُه ‎--h‎. */
  .glyph{
    width:calc(var(--h)*2.30); height:calc(var(--h)*2.30);
    display:block; flex:0 0 auto;
  }
  .wordmark{
    font-size:calc(var(--h)*0.58); line-height:1; color:#102236;
    font-feature-settings:'swsh' 1; white-space:nowrap;
  }
  .tagline{
    position:absolute; z-index:2; bottom:calc(var(--pad)*0.9); inset-inline:var(--pad);
    text-align:center; color:#0f2639; opacity:.5;
    font-size:clamp(11px,1.5vw,13.5px); letter-spacing:.14em;
  }

  /* ═══ المتن ═══ */
  .wrap{ max-width:980px; margin:0 auto; padding:0 var(--pad); }
  .lede{
    padding:clamp(54px,9vh,104px) 0 clamp(40px,7vh,76px);
    font-size:clamp(19px,3.1vw,31px); line-height:1.72; letter-spacing:-.01em;
    max-width:min(24ch, 100%);
  }
  .lede em{ font-style:normal; color:var(--dim); }

  .label{
    padding:clamp(34px,6vh,58px) 0 clamp(14px,2.4vh,22px);
    font-size:12px; letter-spacing:.2em; color:var(--dim);
  }
  .grid{
    display:grid; gap:1px; background:var(--line);
    border-block:1px solid var(--line);
    grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));
  }
  .card{
    background:var(--bg); padding:clamp(26px,4vw,40px) clamp(22px,3vw,34px);
    display:flex; flex-direction:column; gap:10px; min-height:clamp(150px,22vh,210px);
    justify-content:flex-end; transition:background .2s;
  }
  .card:hover{ background:var(--soft); }
  .card .nm{ font-size:clamp(23px,3.4vw,32px); line-height:1.1; }
  .card .ds{ font-size:clamp(13px,1.9vw,15px); color:var(--dim); line-height:1.6; }
  .card .ix{ font-size:11px; letter-spacing:.18em; color:var(--dim); margin-bottom:auto; }

  footer{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:clamp(28px,5vh,46px) var(--pad); max-width:980px; margin:0 auto;
    font-size:12px; color:var(--dim); letter-spacing:.1em;
  }
  .lang{
    appearance:none; border:0; background:transparent; cursor:pointer;
    padding:8px 14px; border-radius:99px; margin:0;
    font-family:inherit; font-weight:800; font-size:12px; letter-spacing:.08em;
    color:var(--dim); transition:color .18s, background .18s;
  }
  .lang:hover,.lang:focus-visible{
    color:var(--ink); background:color-mix(in srgb, var(--ink) 7%, transparent);
  }
  .lang:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }

  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ body{ transition:none; } }
</style>
</head>
<body>

<main>
  <section class="plate" id="plate">
    <div class="lock">
      <canvas class="glyph" id="gl" aria-label="لُب" role="img"></canvas>
      <span class="wordmark" id="wm">لُب</span>
    </div>
    <p class="tagline" id="tag">شركةٌ تقنيّة</p>
  </section>

  <div class="wrap">
    <p class="lede" id="lede">
      نُعيد الإنسانَ إلى لُبّه، إلى عقله.
      <em>ونُعيد صياغةَ علاقته بالتقنية ليصير منتجًا لا مستهلكًا.</em>
    </p>
  </div>

  <div class="wrap"><p class="label" id="lab">المنصّات الثلاث</p></div>
  <div class="grid">
    <article class="card"><span class="ix">٠١</span>
      <h2 class="nm" id="p1n">أكاديميا</h2><p class="ds" id="p1d">منصّةُ العلم</p></article>
    <article class="card"><span class="ix">٠٢</span>
      <h2 class="nm" id="p2n">أجندا</h2><p class="ds" id="p2d">منصّةُ العمل</p></article>
    <article class="card"><span class="ix">٠٣</span>
      <h2 class="nm" id="p3n">أثينا</h2><p class="ds" id="p3d">منصّةُ القراءة</p></article>
  </div>
</main>

<footer>
  <span id="cr">لُب</span>
  <button class="lang" id="lang" type="button">EN</button>
</footer>

<script src="mark-light.js"></script>
<script>
(function () {
  'use strict';

  /* ══ الرمزُ هو «د٤» بعينها.
        هندسةُ المعلَم مصدرُها favicon.svg؛ وهذا الحقلُ مخبوزٌ منها، فإن
        تغيّر المسارُ يومًا وجب توليدُ mark-light.js من جديد. ══ */
  var cv  = document.getElementById('gl');
  var ctx = cv.getContext('2d');
  var still = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* جدولُ السُّلَّم: ٢٥٦ خانةً مسبقةُ الحساب، أرخصُ من مزجٍ لكلّ بكسلٍ وقناة */
  var LUT = (function(){
    var R = window.MARK_RAMP, st = [], L = new Uint8Array(768), i, j, k, t, a, b;
    for (i = 0; i < R.length; i++)
      st.push([parseInt(R[i].slice(1,3),16),
               parseInt(R[i].slice(3,5),16),
               parseInt(R[i].slice(5,7),16)]);
    for (i = 0; i < 256; i++){
      k = i/255*(st.length-1); j = k|0; t = k-j;
      a = st[j]; b = st[Math.min(st.length-1, j+1)];
      L[i*3]   = a[0] + (b[0]-a[0])*t;
      L[i*3+1] = a[1] + (b[1]-a[1])*t;
      L[i*3+2] = a[2] + (b[2]-a[2])*t;
    }
    return L;
  })();

  /* ضجيجُ التمويج: نفسُ دوالّ المختبر بحذافيرها، فالحركةُ هي الحركةُ نفسُها */
  function h2(x, y){
    var h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0;
    h = Math.imul(h ^ h >>> 13, 1274126177);
    return ((h ^ h >>> 16) >>> 0) / 4294967295;
  }
  function vn(x, y){
    var xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    var u = xf*xf*(3 - 2*xf), v = yf*yf*(3 - 2*yf);
    var a = h2(xi, yi), b = h2(xi+1, yi), c = h2(xi, yi+1), d = h2(xi+1, yi+1);
    return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
  }
  function fbm(x, y, o){
    var s = 0, am = 0.5, f = 1, i;
    for (i = 0; i < o; i++){ s += am*vn(x*f, y*f); f *= 2; am *= 0.5; }
    return s;
  }

  var AMP = 0.020, SP = 0.38;              /* معاملا د٤ حرفيًّا */
  var HN = 0, HF = null;                   /* حقلُ الضوء */
  var N = 0, IMG = null, NX, NY, PH;
  var ptr = null, drag = [0, 0], last = null;

  function mesh(n){
    if (n === N) return;
    N = n; cv.width = cv.height = n;
    IMG = ctx.createImageData(n, n);
    NX = new Float32Array(n*n); NY = new Float32Array(n*n); PH = new Float32Array(n*n);
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++){
      var i = y*n + x, u = x/n, v = y/n;
      NX[i] = fbm(u*2.6 +  3.1, v*2.6 + 7.7, 3) - 0.5;
      NY[i] = fbm(u*2.6 + 19.4, v*2.6 + 1.2, 3) - 0.5;
      PH[i] = fbm(u*1.3 + 41.0, v*1.3 + 5.0, 2) * 6.283;
    }
  }

  function paint(ms){
    var r = cv.getBoundingClientRect();
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    mesh(Math.max(150, Math.min(360, Math.round(r.width * dpr) || 200)));
    if (!HF) return;
    var t = ms*0.001, n = N, D = IMG.data, hn = HN, L = LUT;
    drag[0] *= 0.92; drag[1] *= 0.92;
    var px = ptr ? ptr[0] : -9, py = ptr ? ptr[1] : -9;
    for (var y = 0; y < n; y++){
      var v = y/n;
      for (var x = 0; x < n; x++){
        var i = y*n + x, u = x/n;
        var a = still ? 0 : AMP*Math.sin(t*SP + PH[i]);
        var su = u + NX[i]*a, sv = v + NY[i]*a;
        if (ptr){
          var dx = u - px, dy = v - py, g = Math.exp(-(dx*dx + dy*dy)*26);
          su += (dx*0.35 + drag[0]*1.6)*g;
          sv += (dy*0.35 + drag[1]*1.6)*g;
        }
        /* عيّنةٌ ثنائيّةُ الخطّيّة: القفزُ بين البكسلات يُحدث حوافَّ مسنّنة */
        var fx = su*hn - 0.5, fy = sv*hn - 0.5;
        var x0 = fx|0, y0 = fy|0, tx = fx - x0, ty = fy - y0;
        if (x0 < 0) x0 = 0; else if (x0 > hn-2) x0 = hn-2;
        if (y0 < 0) y0 = 0; else if (y0 > hn-2) y0 = hn-2;
        var o = y0*hn + x0;
        var h = (HF[o]*(1-tx) + HF[o+1]*tx)*(1-ty)
              + (HF[o+hn]*(1-tx) + HF[o+hn+1]*tx)*ty;
        var k = h*255 | 0; if (k < 0) k = 0; else if (k > 255) k = 255;
        k *= 3;
        var q = i*4;
        D[q] = L[k]; D[q+1] = L[k+1]; D[q+2] = L[k+2]; D[q+3] = 255;
      }
    }
    ctx.putImageData(IMG, 0, 0);
  }

  var raf = 0;
  function loop(ms){ paint(ms); raf = requestAnimationFrame(loop); }
  function start(){ if (!raf && HF) raf = requestAnimationFrame(loop); }
  function stop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stop(); else start();
  });
  window.addEventListener('resize', function(){ N = 0; });

  /* المؤشّرُ يَجرّ السائل، كما يَجرّه في المختبر */
  var plate = document.getElementById('plate');
  plate.addEventListener('pointermove', function(e){
    var b = cv.getBoundingClientRect();
    var p = [(e.clientX - b.left)/b.width, (e.clientY - b.top)/b.height];
    if (last){ drag[0] += (p[0]-last[0])*0.9; drag[1] += (p[1]-last[1])*0.9; }
    last = p; ptr = p;
  });
  plate.addEventListener('pointerleave', function(){ ptr = null; last = null; });

  var im = new Image();
  im.onload = function(){
    var n = im.naturalWidth;
    var c = document.createElement('canvas'); c.width = c.height = n;
    var x = c.getContext('2d');
    x.drawImage(im, 0, 0);
    var d = x.getImageData(0, 0, n, n).data, i;
    HF = new Float32Array(n*n);
    for (i = 0; i < n*n; i++) HF[i] = d[i*4]/255;
    HN = n;
    /* لونُ اللوحة = السُّلَّمُ مطبَّقًا على قيمة ركن الحقل، لا القيمةَ خامًا.
       الحقلُ أحاديُّ القناة، فقيمتُه الخامُ رماديّةٌ لا لونُ الصورة. */
    var e = 0, m = 0, j;
    for (j = 0; j < n; j++){
      e += d[(j)*4] + d[((n-1)*n + j)*4] + d[(j*n)*4] + d[(j*n + n-1)*4];
      m += 4;
    }
    var kc = (Math.round(e/m) | 0) * 3;
    plate.style.background = 'rgb(' + LUT[kc] + ',' + LUT[kc+1] + ',' + LUT[kc+2] + ')';
    paint(performance.now());
    start();
  };
  im.src = window.MARK_FIELD;

  /* ══ اللغة: الزرُّ يحمل اللغةَ الأخرى — وعدٌ بما سيصير لا وصفٌ لما هو ══ */
  var KEY = 'lobe-lang';
  var AR = {
    title:'لُب — LOBE', wm:'لُب', tag:'شركةٌ تقنيّة', aria:'لُب',
    lede:'نُعيد الإنسانَ إلى لُبّه، إلى عقله. <em>ونُعيد صياغةَ علاقته بالتقنية ليصير منتجًا لا مستهلكًا.</em>',
    lab:'المنصّات الثلاث', cr:'لُب', btn:'EN', alt:'English',
    p:[['أكاديميا','منصّةُ العلم'],['أجندا','منصّةُ العمل'],['أثينا','منصّةُ القراءة']],
    ix:['٠١','٠٢','٠٣']
  };
  var EN = {
    title:'LOBE — لُب', wm:'LOBE', tag:'A TECHNOLOGY COMPANY', aria:'LOBE',
    lede:'We return people to their core — to their mind. <em>And reshape their relationship with technology, so they become producers, not consumers.</em>',
    lab:'THE THREE PLATFORMS', cr:'LOBE', btn:'ع', alt:'العربيّة',
    p:[['Academia','The platform for knowledge'],['Agenda','The platform for work'],['Athena','The platform for reading']],
    ix:['01','02','03']
  };
  var btn = document.getElementById('lang');
  function txt(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; }

  function set(lang, remember){
    var isAr = lang !== 'en', L = isAr ? AR : EN, i, ix;
    document.documentElement.lang = isAr ? 'ar' : 'en';
    document.documentElement.dir  = isAr ? 'rtl' : 'ltr';
    document.title = L.title;
    txt('wm', L.wm); txt('tag', L.tag); txt('lab', L.lab); txt('cr', L.cr);
    cv.setAttribute('aria-label', L.aria);
    document.getElementById('lede').innerHTML = L.lede;
    for (i = 0; i < 3; i++){
      txt('p' + (i+1) + 'n', L.p[i][0]);
      txt('p' + (i+1) + 'd', L.p[i][1]);
    }
    ix = document.querySelectorAll('.card .ix');
    for (i = 0; i < ix.length; i++) ix[i].textContent = L.ix[i];
    btn.textContent = L.btn;
    btn.setAttribute('aria-label', L.alt);
    if (remember){ try { localStorage.setItem(KEY, isAr ? 'ar' : 'en'); } catch (e) {} }
  }
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  set(saved === 'en' ? 'en' : 'ar', false);
  btn.addEventListener('click', function(){
    set(document.documentElement.lang === 'ar' ? 'en' : 'ar', true);
  });

  /* لا تُكشف الصفحةُ قبل وصول خطّها، وإلّا رُئي الاسمُ بخطّ النظام لحظةً.
     والمهلةُ حارسٌ: إن تعذّر الخطُّ لم تبقَ الصفحةُ بيضاءَ أبدًا. */
  function reveal(){ document.body.classList.add('ready'); start(); }
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(reveal, reveal);
    setTimeout(reveal, 2500);
  } else { reveal(); }
})();
</script>
</body>
</html>
