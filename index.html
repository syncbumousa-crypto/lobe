<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لُب — LOBE</title>
<meta name="description" content="لُب — شركةٌ تقنيّة. نُعيد الإنسانَ إلى لُبّه، ليصير منتجًا لا مستهلكًا.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  /* ثلاثةُ أدوار، لا ثلاثُ زينات:
     Heliopolis Heavy للعناوين وحدَها — وزنٌ واحد، وهو ما تملكه الهويّة.
     Plex Arabic للمتن، فالثقيلُ لا يصلح للقراءة الطويلة.
     Plex Mono للعناوين الصغيرة اللاتينيّة، ودورُه إعطاءُ نكهةٍ تقنيّة.
     Newsreader للإنجليزيّة. وكلُّها محلّيّةٌ: الصفحةُ تعمل بلا إنترنت. */
  @font-face{ font-family:"Heliopolis"; font-weight:800; font-display:block;
    src:url("fonts/HT-Heliopolis-Heavy.woff2") format("woff2"); }
  @font-face{ font-family:"PlexAR"; font-weight:400; font-display:swap;
    src:url("fonts/PlexArabic-400.woff2") format("woff2"); }
  @font-face{ font-family:"PlexAR"; font-weight:500; font-display:swap;
    src:url("fonts/PlexArabic-500.woff2") format("woff2"); }
  @font-face{ font-family:"PlexMono"; font-weight:400; font-display:swap;
    src:url("fonts/PlexMono-400.woff2") format("woff2"); }
  @font-face{ font-family:"Newsreader"; font-weight:400 700; font-display:block;
    src:url("fonts/Newsreader.woff2") format("woff2"); }

  :root{
    --paper:#fbfaf9; --ink:#171614; --dim:#8a867d; --line:#e6e3dd; --card:#ffffff;
    --accent:#2f5e96;
    --pad: clamp(18px, 4.5vw, 54px);
    --max: 1180px;
    --r: clamp(20px, 3.2vw, 40px);
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#100f0e; --ink:#f2f1ed; --dim:#6b6860; --line:#262521; --card:#1a1917; }
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"PlexAR","Newsreader",system-ui,sans-serif; font-weight:400;
    font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased;
    opacity:0; transition:opacity .45s ease;
  }
  body.ready{ opacity:1; }
  html[lang="en"] body{ font-family:"Newsreader",serif; }

  h1,h2,h3,.disp{
    font-family:"Heliopolis","Newsreader",serif; font-weight:800;
    line-height:1.14; letter-spacing:-.02em; margin:0;
  }
  html[lang="en"] h1, html[lang="en"] h2, html[lang="en"] h3, html[lang="en"] .disp{
    font-family:"Newsreader",serif; font-weight:600; letter-spacing:-.025em;
  }
  .eyebrow{
    font-family:"PlexMono",monospace; font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--dim);
  }
  .wrap{ max-width:var(--max); margin:0 auto; padding-inline:var(--pad); }

  /* ═══ شريطٌ كبسوليٌّ عائم ═══ */
  .nav{ position:sticky; top:14px; z-index:40; display:flex; justify-content:center; pointer-events:none; }
  .navin{
    pointer-events:auto; display:flex; align-items:center; gap:18px;
    background:color-mix(in srgb, var(--paper) 78%, transparent);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border:1px solid var(--line); border-radius:99px; padding:8px 10px 8px 18px;
  }
  .navin .mk{ width:22px; height:auto; color:var(--ink); display:block; }
  .navin .nm{ font-family:"Heliopolis",serif; font-weight:800; font-size:15px; }
  html[lang="en"] .navin .nm{ font-family:"Newsreader",serif; font-weight:600; }
  .pill{
    appearance:none; background:transparent; cursor:pointer; color:var(--dim);
    border:1px solid var(--line); border-radius:99px; padding:5px 13px;
    font-family:"PlexMono",monospace; font-size:11px; letter-spacing:.1em;
    transition:color .18s, border-color .18s;
  }
  .pill:hover,.pill:focus-visible{ color:var(--ink); border-color:var(--dim); }
  .pill:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ═══ البطل ═══ */
  .hero{ display:grid; gap:clamp(26px,4vw,52px); align-items:center;
         grid-template-columns:1fr; padding-block:clamp(46px,8vh,96px) clamp(30px,5vh,60px); }
  @media (min-width:900px){ .hero{ grid-template-columns:1.05fr .95fr; } }
  .hero h1{ font-size:clamp(38px,7.4vw,92px); }
  .hero h1 .ln{ display:block; white-space:nowrap; }
  .hero p{ margin:clamp(18px,2.6vh,28px) 0 0; max-width:34ch; color:var(--dim); font-size:clamp(15px,1.6vw,18px); }
  .hero .eyebrow{ display:block; margin-bottom:clamp(16px,2.4vh,26px); }

  .plate{ position:relative; overflow:hidden; border-radius:var(--r);
          aspect-ratio:1/1; background:#4d7ab5; }
  .plate canvas{ width:100%; height:100%; display:block; }

  /* ═══ الفاصلُ الكبير ═══ */
  .divider{ padding-block:clamp(34px,6vh,74px); display:flex; justify-content:center; }
  .divider svg{ width:clamp(58px,7vw,96px); height:auto; color:var(--line); }

  /* ═══ البِنتو ═══ */
  .bento{ display:grid; gap:clamp(12px,1.6vw,20px); grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); }
  .cell{
    position:relative; overflow:hidden; border-radius:var(--r);
    background:var(--card); border:1px solid var(--line);
    padding:clamp(24px,3vw,36px); min-height:clamp(260px,34vh,340px);
    display:flex; flex-direction:column; justify-content:flex-end; gap:8px;
  }
  .cell.fill{ background:#17161c; border-color:#17161c; color:#fbfaf9; }
  .cell.fill .eyebrow, .cell.fill .sub{ color:rgba(251,250,249,.56); }
  .cell.wide{ grid-column:1/-1; }
  @media (min-width:900px){ .cell.wide{ grid-column:span 2; } }
  .cell h3{ font-size:clamp(23px,2.6vw,31px); }
  .cell .sub{ color:var(--dim); font-size:14.5px; }
  .cell img{
    position:absolute; width:clamp(130px,17vw,200px); height:auto;
    top:clamp(-26px,-2vw,-14px); inset-inline-end:clamp(-22px,-1.6vw,-10px);
    filter:drop-shadow(0 18px 34px rgba(0,0,0,.18));
    pointer-events:none; user-select:none;
  }

  /* ═══ البيت ═══ */
  .verse{
    margin-top:clamp(16px,2.4vw,24px); border-radius:var(--r);
    background:var(--ink); color:var(--paper);
    padding:clamp(44px,8vw,96px) clamp(24px,5vw,64px); text-align:center;
  }
  .verse .bayt{ font-family:"Heliopolis",serif; font-weight:800; direction:rtl;
    font-size:clamp(21px,3.6vw,42px); line-height:1.75; display:grid; gap:.08em; }
  .verse mark{ background:none; color:var(--accent); }
  .verse cite{ display:block; margin-top:clamp(22px,3vh,34px); font-style:normal;
    font-family:"PlexMono",monospace; font-size:11px; letter-spacing:.2em;
    color:color-mix(in srgb, var(--paper) 52%, transparent); }
  .verse .gloss{ margin:18px auto 0; max-width:48ch; direction:ltr;
    font-family:"Newsreader",serif; font-size:14.5px; line-height:1.7;
    color:color-mix(in srgb, var(--paper) 62%, transparent); }
  .verse .gloss em{ font-style:italic; }

  /* ═══ الذيل ═══ */
  footer{ padding-block:clamp(44px,7vh,88px) clamp(28px,4vh,44px); }
  .foot{ display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
         border-top:1px solid var(--line); padding-top:22px;
         font-family:"PlexMono",monospace; font-size:11px; letter-spacing:.14em; color:var(--dim); }
  .swatches{ display:flex; align-items:center; gap:8px; }
  .sw{ width:18px; height:18px; border-radius:99px; border:1px solid transparent;
       padding:0; cursor:pointer; background:transparent; position:relative; }
  .sw i{ position:absolute; inset:3px; border-radius:99px; display:block; }
  .sw[aria-pressed="true"]{ border-color:var(--dim); }
  .sw:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ body{ transition:none; } }
</style>
</head>
<body>

<div class="nav"><div class="navin">
  <svg class="mk" viewBox="-154.995 57.485 309.99 244.515" aria-hidden="true"><path d="M-140.75,148.39 A54.25,54.25 0 1,1 -50.37,91.6 A54.25,54.25 0 0,1 50.38,91.6 A54.25,54.25 0 1,1 140.75,148.39 L0,302 Z" fill="currentColor"/></svg>
  <span class="nm" id="wm">لُب</span>
  <button class="pill" id="lang" type="button">EN</button>
</div></div>

<main class="wrap">
  <section class="hero">
    <div>
      <span class="eyebrow" id="eyebrow"></span>
      <h1 id="h1"></h1>
      <p id="lede"></p>
    </div>
    <div class="plate" aria-label="لُب"><canvas id="gl"></canvas></div>
  </section>

  <div class="divider">
    <svg viewBox="-154.995 57.485 309.99 244.515" aria-hidden="true"><path d="M-140.75,148.39 A54.25,54.25 0 1,1 -50.37,91.6 A54.25,54.25 0 0,1 50.38,91.6 A54.25,54.25 0 1,1 140.75,148.39 L0,302 Z" fill="currentColor"/></svg>
  </div>

  <div class="bento" id="bento"></div>

  <section class="verse">
    <p class="bayt" id="verse"></p>
    <p class="gloss" id="gloss" hidden></p>
    <cite id="cite"></cite>
  </section>
</main>

<footer class="wrap">
  <div class="foot">
    <span id="cr">لُب</span>
    <span class="swatches"><span id="swl">اللون</span><span id="sws"></span></span>
  </div>
</footer>

<script src="mark-light.js"></script>
<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     ١ · التطويلُ المحسوب
     «صوت» تُطوِّل عناوينَها بحرف التطويل ليتساوى طولُ السطرَين.
     هنا يُحسب العددُ بالقياس لا باليد: تُعرف المواضعُ الصالحة
     (حرفٌ يتّصل بما بعده)، ثمّ يُزاد التطويلُ حتى يبلغ السطرُ
     عرضَ أطولِ إخوته. فالضبطُ يصحّ مهما تغيّر الخطُّ أو المقاس.
     ══════════════════════════════════════════════════════════ */
  var NOJOIN = 'ادذرزوؤأإآةىءٱ';           /* حروفٌ لا تتّصل بما بعدها */
  function isAr(c){ return c >= 'ء' && c <= 'ي'; }
  function sites(s){
    var out = [], i;
    for (i = 0; i < s.length - 1; i++){
      if (!isAr(s[i]) || NOJOIN.indexOf(s[i]) >= 0) continue;
      if (!isAr(s[i+1])) continue;
      out.push(i + 1);
    }
    return out;
  }
  function stretch(s, n){
    if (n <= 0) return s;
    var p = sites(s);
    if (!p.length) return s;
    var add = new Array(p.length).fill(0), i;
    for (i = 0; i < n; i++) add[i % p.length]++;
    var out = '', k = 0, j;
    for (i = 0; i < s.length; i++){
      out += s[i];
      if (k < p.length && p[k] === i + 1){
        for (j = 0; j < add[k]; j++) out += 'ـ';
        k++;
      }
    }
    return out;
  }
  function justify(host, lines){
    host.innerHTML = '';
    var spans = [], i;
    for (i = 0; i < lines.length; i++){
      var sp = document.createElement('span');
      sp.className = 'ln'; sp.textContent = lines[i];
      host.appendChild(sp); spans.push(sp);
    }
    if (document.documentElement.lang !== 'ar') return;
    var target = 0;
    for (i = 0; i < spans.length; i++) target = Math.max(target, spans[i].offsetWidth);
    for (i = 0; i < spans.length; i++){
      var n = 0, guard = 0;
      while (spans[i].offsetWidth < target - 2 && guard++ < 60){
        n++; spans[i].textContent = stretch(lines[i], n);
        if (spans[i].offsetWidth > target + 6){        /* تجاوزَ، فيُرَدُّ خطوة */
          n--; spans[i].textContent = stretch(lines[i], n); break;
        }
      }
    }
  }

  /* ══ ٢ · ضوءُ المعلَم (د٤) ولحظةُ بنائه ══ */
  var R = 54.25, CY = 111.735, CXS = [-100.75, 0, 100.75];
  var TIP = [0, 302], LP = [-140.75, 148.39], RP = [140.75, 148.39];
  var BOXCY = 179.7425, BOXS = 309.99;
  var still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LUT = (function(){
    var P = window.MARK_RAMP, st = [], T = new Uint8Array(768), i, j, k, t, a, b;
    for (i = 0; i < P.length; i++)
      st.push([parseInt(P[i].slice(1,3),16), parseInt(P[i].slice(3,5),16), parseInt(P[i].slice(5,7),16)]);
    for (i = 0; i < 256; i++){
      k = i/255*(st.length-1); j = k|0; t = k-j;
      a = st[j]; b = st[Math.min(st.length-1, j+1)];
      T[i*3]=a[0]+(b[0]-a[0])*t; T[i*3+1]=a[1]+(b[1]-a[1])*t; T[i*3+2]=a[2]+(b[2]-a[2])*t;
    }
    return T;
  })();
  function h2(x,y){ var h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;
    h=Math.imul(h^h>>>13,1274126177); return ((h^h>>>16)>>>0)/4294967295; }
  function vn(x,y){ var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    var a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
  function fbm(x,y,o){ var s=0,am=.5,f=1,i; for(i=0;i<o;i++){s+=am*vn(x*f,y*f);f*=2;am*=.5;} return s; }

  var HF=null, HN=0, PLATE='#4d7ab5', AMP=0.020, SP=0.38;
  var lightCv = document.createElement('canvas'), lctx = lightCv.getContext('2d');
  var LN = 0, LIMG, NX, NY, PH;
  function paintLight(t, n){
    if (n !== LN){
      LN = n; lightCv.width = lightCv.height = n; LIMG = lctx.createImageData(n,n);
      NX = new Float32Array(n*n); NY = new Float32Array(n*n); PH = new Float32Array(n*n);
      for (var y=0;y<n;y++) for (var x=0;x<n;x++){
        var i=y*n+x,u=x/n,v=y/n;
        NX[i]=fbm(u*2.6+3.1,v*2.6+7.7,3)-0.5;
        NY[i]=fbm(u*2.6+19.4,v*2.6+1.2,3)-0.5;
        PH[i]=fbm(u*1.3+41,v*1.3+5,2)*6.283;
      }
    }
    if (!HF) return;
    var D=LIMG.data, hn=HN, T=LUT;
    for (var y2=0;y2<n;y2++){ var v2=y2/n;
      for (var x2=0;x2<n;x2++){
        var i2=y2*n+x2, u2=x2/n;
        var a = still ? 0 : AMP*Math.sin(t*SP+PH[i2]);
        var su=u2+NX[i2]*a, sv=v2+NY[i2]*a;
        var fx=su*hn-0.5, fy=sv*hn-0.5, x0=fx|0, y0=fy|0, tx=fx-x0, ty=fy-y0;
        if(x0<0)x0=0; else if(x0>hn-2)x0=hn-2;
        if(y0<0)y0=0; else if(y0>hn-2)y0=hn-2;
        var o=y0*hn+x0;
        var h=(HF[o]*(1-tx)+HF[o+1]*tx)*(1-ty)+(HF[o+hn]*(1-tx)+HF[o+hn+1]*tx)*ty;
        var k=h*255|0; if(k<0)k=0; else if(k>255)k=255; k*=3;
        var q=i2*4; D[q]=T[k]; D[q+1]=T[k+1]; D[q+2]=T[k+2]; D[q+3]=255;
      }
    }
    lctx.putImageData(LIMG,0,0);
  }

  var cv = document.getElementById('gl'), ctx = cv.getContext('2d'), T0 = -1;
  function drawPlate(ms){
    var r = cv.getBoundingClientRect(); if (!r.width) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var W = Math.round(r.width*dpr), H = Math.round(r.height*dpr);
    if (cv.width !== W || cv.height !== H){ cv.width = W; cv.height = H; }
    if (T0 < 0) T0 = ms;
    var e = still ? 99 : (ms - T0)/1000, side = Math.min(W, H);
    var lit = e < 2.9 ? 0 : Math.min(1, (e-2.9)/1.2);
    if (lit > 0) paintLight(ms*0.001, Math.min(360, side));

    ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1;
    ctx.fillStyle = PLATE; ctx.fillRect(0,0,W,H);
    if (lit > 0){
      ctx.globalAlpha = lit;
      ctx.drawImage(lightCv, (W-side)/2, (H-side)/2, side, side);
      ctx.globalAlpha = 1;
    }
    if (lit >= 1) return;

    var s = side*0.55/BOXS, fade = 1-lit, i, a;
    ctx.save();
    ctx.translate(W/2, H/2 - s*BOXCY);
    ctx.scale(s, s);
    ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.strokeStyle='#fff'; ctx.fillStyle='#fff';
    for (i = 0; i < 3; i++){
      a = Math.min(1, Math.max(0, (e - i*0.44)/0.6));
      if (a <= 0) continue;
      ctx.lineWidth = 2.6; ctx.globalAlpha = 0.40*fade;
      ctx.beginPath(); ctx.arc(CXS[i], CY, R, -Math.PI/2, -Math.PI/2 + a*6.2832); ctx.stroke();
      ctx.globalAlpha = 0.85*fade;
      ctx.beginPath(); ctx.arc(CXS[i], CY, 3.6, 0, 6.2832); ctx.fill();
    }
    if (e > 1.8){
      var g = Math.min(1, (e-1.8)/0.85);
      ctx.globalAlpha = 0.85*fade; ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(LP[0],LP[1]); ctx.lineTo(LP[0]+(TIP[0]-LP[0])*g, LP[1]+(TIP[1]-LP[1])*g);
      ctx.moveTo(RP[0],RP[1]); ctx.lineTo(RP[0]+(TIP[0]-RP[0])*g, RP[1]+(TIP[1]-RP[1])*g);
      ctx.stroke();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  var raf = 0, lastF = 0;
  function loop(ms){ if (ms - lastF > 32){ lastF = ms; drawPlate(ms); } raf = requestAnimationFrame(loop); }
  function start(){ if (!raf && HF) raf = requestAnimationFrame(loop); }
  function stop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stop(); else start(); });

  (function(){
    var im = new Image();
    im.onload = function(){
      var n = im.naturalWidth, c = document.createElement('canvas');
      c.width = c.height = n;
      var x = c.getContext('2d'); x.drawImage(im,0,0);
      var d = x.getImageData(0,0,n,n).data, i;
      HF = new Float32Array(n*n);
      for (i=0;i<n*n;i++) HF[i] = d[i*4]/255;
      HN = n;
      var kc = d[0]*3;
      PLATE = 'rgb('+LUT[kc]+','+LUT[kc+1]+','+LUT[kc+2]+')';
      document.querySelector('.plate').style.background = PLATE;
      T0 = -1; start();
    };
    im.src = window.MARK_FIELD;
  })();

  /* ══ ٣ · اللون ══ */
  var ACC = [['#2f5e96','#7fa9d8'],['#b4543c','#e0917a'],['#5c6b3c','#a3b47a'],
             ['#3b3f7a','#8c91d2'],['#8f5a2a','#d09a5f'],['#7a3340','#c67a86']];
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  function applyAcc(i, remember){
    document.documentElement.style.setProperty('--accent', ACC[i][dark?1:0]);
    var b = document.querySelectorAll('.sw'), j;
    for (j=0;j<b.length;j++) b[j].setAttribute('aria-pressed', String(j===i));
    if (remember){ try{ localStorage.setItem('lobe-acc', String(i)); }catch(e){} }
  }
  (function(){
    var host = document.getElementById('sws'), i, b, s;
    for (i=0;i<ACC.length;i++){
      b = document.createElement('button');
      b.className='sw'; b.type='button'; b.setAttribute('data-i', String(i));
      s = document.createElement('i'); s.style.background = ACC[i][dark?1:0];
      b.appendChild(s);
      b.addEventListener('click', function(){ applyAcc(+this.getAttribute('data-i'), true); });
      host.appendChild(b);
    }
  })();

  /* ══ ٤ · اللغة. والبيتُ يبقى عربيًّا: هو الأثرُ لا الترجمة ══ */
  var BAYT = ['وإنَّ لِساناً لم تُعِنْهُ لُبابةٌ', 'كحاطبِ ليلٍ يجمعُ الرَّذْلَ حاطبُهْ'];
  var AR = {
    t:'لُب — LOBE', wm:'لُب', btn:'EN', alt:'English', cr:'لُب — ٢٠٢٦', swl:'اللون',
    eyebrow:'A TECHNOLOGY COMPANY',
    h1:['نُعيد الإنسان','إلى عقله'],
    lede:'ونُعيد صياغةَ علاقته بالتقنية ليصير منتجًا لا مستهلكًا.',
    cite:'ابن الدُّمَينة', gloss:'',
    cells:[
      {k:'alu',     e:'٠١', n:'أكاديميا', s:'منصّةُ العلم',   fill:true },
      {k:'copper',  e:'٠٢', n:'أجندا',    s:'منصّةُ العمل',   fill:false },
      {k:'iris',    e:'٠٣', n:'أثينا',    s:'منصّةُ القراءة', fill:false },
      {k:'ceramic', e:'لُب', n:'منتجًا لا مستهلكًا', s:'ثلاثُ منصّاتٍ من أصلٍ واحد', fill:true, wide:true }
    ]
  };
  var EN = {
    t:'LOBE — لُب', wm:'LOBE', btn:'ع', alt:'العربيّة', cr:'LOBE — 2026', swl:'ACCENT',
    eyebrow:'A TECHNOLOGY COMPANY',
    h1:['We return people','to their mind'],
    lede:'And reshape their relationship with technology, so they become producers, not consumers.',
    cite:'Ibn al-Dumayna',
    gloss:'A tongue unaided by <em>lubāba</em> — the kernel of the mind — gathers firewood by night, and hauls home whatever is worthless.',
    cells:[
      {k:'alu',     e:'01',   n:'Academia', s:'The platform for knowledge', fill:true },
      {k:'copper',  e:'02',   n:'Agenda',   s:'The platform for work',      fill:false },
      {k:'iris',    e:'03',   n:'Athena',   s:'The platform for reading',   fill:false },
      {k:'ceramic', e:'LOBE', n:'Producers, not consumers', s:'Three platforms from one root', fill:true, wide:true }
    ]
  };
  function el(id){ return document.getElementById(id); }
  function set(lang, remember){
    var isArL = lang !== 'en', D = isArL ? AR : EN, i, h = '';
    document.documentElement.lang = isArL ? 'ar' : 'en';
    document.documentElement.dir  = isArL ? 'rtl' : 'ltr';
    document.title = D.t;
    el('wm').textContent = D.wm; el('cr').textContent = D.cr; el('swl').textContent = D.swl;
    el('lang').textContent = D.btn; el('lang').setAttribute('aria-label', D.alt);
    el('eyebrow').textContent = D.eyebrow;
    el('lede').textContent = D.lede;
    el('cite').textContent = D.cite;
    if (D.gloss){ el('gloss').innerHTML = D.gloss; el('gloss').removeAttribute('hidden'); }
    else el('gloss').setAttribute('hidden','');
    for (i = 0; i < D.cells.length; i++){
      var c = D.cells[i];
      h += '<article class="cell' + (c.fill?' fill':'') + (c.wide?' wide':'') + '">'
         + '<img src="img/mark-' + c.k + '.webp" alt="" loading="lazy" decoding="async">'
         + '<span class="eyebrow">' + c.e + '</span>'
         + '<h3>' + c.n + '</h3><p class="sub">' + c.s + '</p></article>';
    }
    el('bento').innerHTML = h;
    justify(el('h1'), D.h1);
    justify(el('verse'), BAYT);
    if (remember){ try{ localStorage.setItem('lobe-lang', isArL?'ar':'en'); }catch(e){} }
  }
  var sv=null, sa=null;
  try{ sv=localStorage.getItem('lobe-lang'); sa=localStorage.getItem('lobe-acc'); }catch(e){}
  applyAcc(sa !== null && ACC[+sa] ? +sa : 0, false);
  set(sv === 'en' ? 'en' : 'ar', false);
  el('lang').addEventListener('click', function(){
    set(document.documentElement.lang === 'ar' ? 'en' : 'ar', true);
  });

  var rt = 0;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){
      justify(el('h1'), (document.documentElement.lang === 'ar' ? AR : EN).h1);
      justify(el('verse'), BAYT);
    }, 180);
  });

  /* التطويلُ يُقاس بعد وصول الخطّ، وإلّا ضُبط على خطّ النظام ثمّ قفز */
  var shown = false;
  function reveal(){
    if (shown) return;
    shown = true;
    var D = document.documentElement.lang === 'ar' ? AR : EN;
    justify(el('h1'), D.h1); justify(el('verse'), BAYT);
    document.body.classList.add('ready');
    T0 = -1; start();
  }
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(reveal, reveal);
    setTimeout(reveal, 2500);
  } else { setTimeout(reveal, 200); }
})();
</script>
</body>
</html>
