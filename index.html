<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لُب — LOBE</title>
<meta name="description" content="لُب — شركةٌ تقنيّة. نُعيد الإنسانَ إلى لُبّه، ليصير منتجًا لا مستهلكًا.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>
  /* العربيّةُ وزنٌ واحدٌ كما هي. والإنجليزيّةُ رَقَعيٌّ متغيّرُ المحور:
     ملفٌّ واحدٌ يحمل الوزنَين، فالثخانةُ متاحةٌ للاتينيّة وحدَها.
     و‎block‎ لا ‎swap‎: الاسمُ لا يُعرض بخطٍّ آخرَ لحظةً ثمّ يَقفز. */
  @font-face{
    font-family:"HT Heliopolis"; font-style:normal; font-weight:800; font-display:block;
    src:url("fonts/HT-Heliopolis-Heavy.woff2") format("woff2");
  }
  @font-face{
    font-family:"Newsreader"; font-style:normal; font-weight:400 700; font-display:block;
    src:url("fonts/Newsreader.woff2") format("woff2");
  }

  :root{
    --paper:#fbfaf9; --ink:#1b1a18; --dim:#8d8980; --line:#e4e1db;
    --accent:#2f5e96;
    --h: clamp(58px, 10vmin, 104px);
    --pad: clamp(20px, 5vw, 56px);
    --max: 1120px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#121211; --ink:#f0efec; --dim:#6a6760; --line:#262520; }
  }

  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"HT Heliopolis","Newsreader",serif; font-weight:800;
    -webkit-font-smoothing:antialiased;
    opacity:0; transition:opacity .5s ease;
  }
  body.ready{ opacity:1; }
  html[lang="en"] body{ font-family:"Newsreader",serif; font-weight:400; }

  .wrap{ max-width:var(--max); margin:0 auto; padding-inline:var(--pad); }
  .hr{ height:1px; background:var(--line); }

  /* ═══ الرأس ═══ */
  .top{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding-block:18px; }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand .mk{ width:26px; height:auto; display:block; color:var(--ink); }
  .brand b{ font-size:16px; font-weight:inherit; }
  .pill{
    appearance:none; background:transparent; cursor:pointer;
    border:1px solid var(--line); border-radius:99px; padding:7px 15px;
    font-family:inherit; font-weight:inherit; font-size:12px; letter-spacing:.07em;
    color:var(--dim); transition:color .18s, border-color .18s;
  }
  .pill:hover,.pill:focus-visible{ color:var(--ink); border-color:var(--dim); }
  .pill:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ═══ البيان: العربيّةُ وزنٌ واحد، فالتمييزُ باللون لا بالثخانة ═══ */
  .say{
    padding-block:clamp(56px,10vh,124px) clamp(40px,7vh,86px);
    font-size:clamp(25px,4.3vw,50px); line-height:1.52; letter-spacing:-.015em;
    max-width:min(26ch,100%); margin:0;
  }
  .say .rest{ color:var(--dim); }
  html[lang="en"] .say{ font-weight:400; line-height:1.3; }
  html[lang="en"] .say .lead{ font-weight:600; }
  html[lang="en"] .say .rest{ color:var(--ink); opacity:.58; }

  /* ═══ اللوحة ═══ */
  .plate{ position:relative; overflow:hidden; aspect-ratio:16/9; min-height:290px; background:#4d7ab5; }
  .plate canvas{ width:100%; height:100%; display:block; }
  .caption{
    display:flex; justify-content:space-between; gap:16px; padding-block:12px 0;
    font-size:11.5px; letter-spacing:.14em; color:var(--dim);
  }

  /* ═══ البيت ═══ */
  .verse{ padding-block:clamp(64px,12vh,150px); text-align:center; }
  .verse p.bayt{
    display:grid; gap:.1em;
    max-width:min(46ch,100%);
    font-family:"HT Heliopolis",serif; font-weight:800; direction:rtl;
    font-size:clamp(19px,3.2vw,35px); line-height:1.9; letter-spacing:-.01em;
  }
  .verse .sep{ color:var(--line); padding-inline:.45em; letter-spacing:.2em; }
  .verse mark{ background:none; color:var(--accent); }
  .verse cite{
    display:block; margin-top:clamp(20px,3vh,32px); font-style:normal;
    font-size:11.5px; letter-spacing:.16em; color:var(--dim);
  }
  .verse .gloss{
    margin:16px auto 0; max-width:min(46ch,100%);
    font-size:14px; line-height:1.75; color:var(--dim);
    font-family:"Newsreader",serif; font-weight:400; letter-spacing:0; direction:ltr;
  }
  .verse .gloss em{ font-style:italic; }

  /* ═══ المنصّات ═══ */
  .lab{ font-size:11.5px; letter-spacing:.2em; color:var(--dim); margin:0; padding-block:0 18px; }
  .cols{ display:grid; gap:0 clamp(26px,4vw,56px); grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr)); }
  .col{ padding-block:26px 30px; border-top:1px solid var(--line); }
  .col h2{ margin:0 0 10px; font-size:clamp(24px,3.2vw,33px); line-height:1.1; font-weight:inherit; }
  .col > p{ margin:0 0 22px; font-size:14.5px; line-height:1.7; color:var(--dim); }
  html[lang="en"] .col h2{ font-weight:600; }
  .row{
    display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    padding-block:11px; border-top:1px solid var(--line);
    font-size:12.5px; letter-spacing:.04em; color:var(--dim);
  }
  .row b{ font-weight:inherit; color:var(--ink); }
  .row .go{ color:var(--accent); }

  /* ═══ الذيل ومبدِّلُ اللون ═══ */
  footer{ padding-block:clamp(34px,6vh,64px) clamp(26px,4vh,40px); }
  .foot{
    display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap;
    padding-top:22px; font-size:11.5px; letter-spacing:.12em; color:var(--dim);
  }
  .swatches{ display:flex; align-items:center; gap:9px; }
  .sw{
    width:18px; height:18px; border-radius:99px; border:1px solid transparent;
    padding:0; cursor:pointer; background:transparent; position:relative;
  }
  .sw i{ position:absolute; inset:3px; border-radius:99px; display:block; }
  .sw[aria-pressed="true"]{ border-color:var(--dim); }
  .sw:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion:reduce){ body{ transition:none; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg class="mk" viewBox="-154.995 57.485 309.99 244.515" aria-hidden="true"><path d="M-140.75,148.39 A54.25,54.25 0 1,1 -50.37,91.6 A54.25,54.25 0 0,1 50.38,91.6 A54.25,54.25 0 1,1 140.75,148.39 L0,302 Z" fill="currentColor"/></svg><b id="wm">لُب</b></div>
    <button class="pill" id="lang" type="button">EN</button>
  </header>
  <div class="hr"></div>

  <p class="say" id="say"></p>

  <section class="plate" aria-label="لُب"><canvas id="gl"></canvas></section>
  <div class="caption"><span id="capA"></span><span id="capB"></span></div>

  <section class="verse">
    <p class="bayt" id="verse"></p>
    <p class="gloss" id="gloss" hidden></p>
    <cite id="cite"></cite>
  </section>

  <p class="lab" id="lab"></p>
  <div class="cols" id="cols"></div>
</div>

<footer class="wrap">
  <div class="hr"></div>
  <div class="foot">
    <span id="cr">لُب</span>
    <span class="swatches"><span id="swl">اللون</span><span id="sws"></span></span>
  </div>
</footer>

<script src="mark-light.js"></script>
<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     المعلَمُ قاعدةٌ مولِّدةٌ مقيسة: ثلاثُ دوائرَ r=54.25 مراكزُها على
     y=111.735 عند x = −100.75 · 0 · +100.75، وضلعان مماسّان إلى
     رأسٍ عند (0,302). الصندوق 309.99×244.515، ومركزُه (0, 179.74).
     ══════════════════════════════════════════════════════════ */
  var R = 54.25, CY = 111.735, CXS = [-100.75, 0, 100.75];
  var TIP = [0, 302], LP = [-140.75, 148.39], RP = [140.75, 148.39];
  var BOXCX = 0, BOXCY = 179.7425, BOXS = 309.99;

  var still = window.matchMedia
    && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var LUT = (function(){
    var P = window.MARK_RAMP, st = [], T = new Uint8Array(768), i, j, k, t, a, b;
    for (i = 0; i < P.length; i++)
      st.push([parseInt(P[i].slice(1,3),16), parseInt(P[i].slice(3,5),16), parseInt(P[i].slice(5,7),16)]);
    for (i = 0; i < 256; i++){
      k = i/255*(st.length-1); j = k|0; t = k-j;
      a = st[j]; b = st[Math.min(st.length-1, j+1)];
      T[i*3] = a[0]+(b[0]-a[0])*t; T[i*3+1] = a[1]+(b[1]-a[1])*t; T[i*3+2] = a[2]+(b[2]-a[2])*t;
    }
    return T;
  })();
  function h2(x,y){ var h = Math.imul(x,374761393)+Math.imul(y,668265263)|0;
    h = Math.imul(h^h>>>13,1274126177); return ((h^h>>>16)>>>0)/4294967295; }
  function vn(x,y){ var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    var u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    var a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
  function fbm(x,y,o){ var s=0,am=.5,f=1,i; for(i=0;i<o;i++){s+=am*vn(x*f,y*f);f*=2;am*=.5;} return s; }

  var HF = null, HN = 0, PLATE = '#4d7ab5';
  var AMP = 0.020, SP = 0.38;

  function loadField(cb){
    var im = new Image();
    im.onload = function(){
      var n = im.naturalWidth, c = document.createElement('canvas');
      c.width = c.height = n;
      var x = c.getContext('2d'); x.drawImage(im, 0, 0);
      var d = x.getImageData(0,0,n,n).data, i;
      HF = new Float32Array(n*n);
      for (i = 0; i < n*n; i++) HF[i] = d[i*4]/255;
      HN = n;
      var kc = d[0]*3;
      PLATE = 'rgb(' + LUT[kc] + ',' + LUT[kc+1] + ',' + LUT[kc+2] + ')';
      document.querySelector('.plate').style.background = PLATE;
      cb();
    };
    im.src = window.MARK_FIELD;
  }

  /* رسّامُ الضوء: د٤ بعينها، معاملاتُها وضجيجُها كما في المختبر */
  function painter(cv){
    var ctx = cv.getContext('2d'), N = 0, IMG, NX, NY, PH;
    function mesh(n){
      if (n === N) return;
      N = n; cv.width = cv.height = n; IMG = ctx.createImageData(n,n);
      NX = new Float32Array(n*n); NY = new Float32Array(n*n); PH = new Float32Array(n*n);
      for (var y=0;y<n;y++) for (var x=0;x<n;x++){
        var i=y*n+x,u=x/n,v=y/n;
        NX[i]=fbm(u*2.6+3.1,v*2.6+7.7,3)-0.5;
        NY[i]=fbm(u*2.6+19.4,v*2.6+1.2,3)-0.5;
        PH[i]=fbm(u*1.3+41,v*1.3+5,2)*6.283;
      }
    }
    return function(t, side){
      mesh(side);
      if (!HF) return;
      var n=N, D=IMG.data, hn=HN, T=LUT;
      for (var y=0;y<n;y++){ var v=y/n;
        for (var x=0;x<n;x++){
          var i=y*n+x, u=x/n;
          var a = still ? 0 : AMP*Math.sin(t*SP+PH[i]);
          var su=u+NX[i]*a, sv=v+NY[i]*a;
          var fx=su*hn-0.5, fy=sv*hn-0.5, x0=fx|0, y0=fy|0, tx=fx-x0, ty=fy-y0;
          if(x0<0)x0=0; else if(x0>hn-2)x0=hn-2;
          if(y0<0)y0=0; else if(y0>hn-2)y0=hn-2;
          var o=y0*hn+x0;
          var h=(HF[o]*(1-tx)+HF[o+1]*tx)*(1-ty)+(HF[o+hn]*(1-tx)+HF[o+hn+1]*tx)*ty;
          var k=h*255|0; if(k<0)k=0; else if(k>255)k=255; k*=3;
          var q=i*4; D[q]=T[k]; D[q+1]=T[k+1]; D[q+2]=T[k+2]; D[q+3]=255;
        }
      }
      ctx.putImageData(IMG,0,0);
    };
  }

  /* ══ لحظةُ التوقيع: واحدةٌ ثمّ اثنتان ثمّ ثلاث، ثمّ ينزل المماسّان
        إلى الرأس، ثمّ يصير المعلَمُ ضوءًا. تُعرض مرّةً ثمّ تسكن. ══ */
  var plateCv = document.getElementById('gl'), pctx = plateCv.getContext('2d');
  var lightBig = document.createElement('canvas'), paintBig = painter(lightBig);
  var T0 = -1;

  function drawPlate(ms){
    var r = plateCv.getBoundingClientRect();
    if (!r.width) return;
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var W = Math.round(r.width*dpr), H = Math.round(r.height*dpr);
    if (plateCv.width !== W || plateCv.height !== H){ plateCv.width = W; plateCv.height = H; }
    if (T0 < 0) T0 = ms;
    var e = still ? 99 : (ms - T0)/1000;
    var side = Math.min(W, H);


    pctx.setTransform(1,0,0,1,0,0);
    pctx.globalAlpha = 1;
    pctx.fillStyle = PLATE; pctx.fillRect(0,0,W,H);

    var lit = e < 2.9 ? 0 : Math.min(1, (e-2.9)/1.2);
    /* لا يُحسب الضوءُ ما دام مخفيًّا: حسابُه لكلّ بكسلٍ أثقلُ ما في الصفحة */
    if (lit > 0) paintBig(ms*0.001, Math.min(340, side));
    if (lit > 0){
      pctx.globalAlpha = lit;
      pctx.drawImage(lightBig, (W-side)/2, (H-side)/2, side, side);
      pctx.globalAlpha = 1;
    }
    if (lit >= 1) return;

    /* إطارُ البناء هو إطارُ الحقل نفسُه، فيَسقط البناءُ على الضوء تمامًا */
    var s = side*0.55/BOXS, fade = 1 - lit, i, a;
    pctx.save();
    pctx.translate(W/2 - s*BOXCX, H/2 - s*BOXCY);
    pctx.scale(s, s);
    pctx.lineJoin = 'round'; pctx.lineCap = 'round';
    pctx.strokeStyle = '#ffffff'; pctx.fillStyle = '#ffffff';
    for (i = 0; i < 3; i++){
      a = Math.min(1, Math.max(0, (e - i*0.44)/0.6));
      if (a <= 0) continue;
      pctx.lineWidth = 2.6;
      pctx.globalAlpha = 0.40*fade;
      pctx.beginPath();
      pctx.arc(CXS[i], CY, R, -Math.PI/2, -Math.PI/2 + a*6.2832);
      pctx.stroke();
      pctx.globalAlpha = 0.85*fade;
      pctx.beginPath(); pctx.arc(CXS[i], CY, 3.6, 0, 6.2832); pctx.fill();
    }
    if (e > 1.8){
      var g = Math.min(1, (e-1.8)/0.85);
      pctx.globalAlpha = 0.85*fade; pctx.lineWidth = 3.2;
      pctx.beginPath();
      pctx.moveTo(LP[0], LP[1]); pctx.lineTo(LP[0]+(TIP[0]-LP[0])*g, LP[1]+(TIP[1]-LP[1])*g);
      pctx.moveTo(RP[0], RP[1]); pctx.lineTo(RP[0]+(TIP[0]-RP[0])*g, RP[1]+(TIP[1]-RP[1])*g);
      pctx.stroke();
    }
    pctx.restore();
    pctx.globalAlpha = 1;
  }

  

  var raf = 0;
  var lastF = 0;
  function loop(ms){ if (ms - lastF > 32){ lastF = ms; drawPlate(ms); } raf = requestAnimationFrame(loop); }
  function start(){ if (!raf && HF) raf = requestAnimationFrame(loop); }
  function stop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }
  document.addEventListener('visibilitychange', function(){ if (document.hidden) stop(); else start(); });

  /* ══ اللون: غيرُ مستقرٍّ بعد، فالاختيارُ معروضٌ في الذيل ويُحفظ ══ */
  var ACC = [
    ['#2f5e96','#7fa9d8'], ['#b4543c','#e0917a'], ['#5c6b3c','#a3b47a'],
    ['#3b3f7a','#8c91d2'], ['#8f5a2a','#d09a5f'], ['#7a3340','#c67a86']
  ];
  var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  function applyAcc(i, remember){
    document.documentElement.style.setProperty('--accent', ACC[i][dark ? 1 : 0]);
    var b = document.querySelectorAll('.sw'), j;
    for (j = 0; j < b.length; j++) b[j].setAttribute('aria-pressed', String(j === i));
    if (remember){ try { localStorage.setItem('lobe-acc', String(i)); } catch (e) {} }
  }
  (function(){
    var host = document.getElementById('sws'), i, b, s;
    for (i = 0; i < ACC.length; i++){
      b = document.createElement('button');
      b.className = 'sw'; b.type = 'button'; b.setAttribute('data-i', String(i));
      s = document.createElement('i'); s.style.background = ACC[i][dark ? 1 : 0];
      b.appendChild(s);
      b.addEventListener('click', function(){ applyAcc(+this.getAttribute('data-i'), true); });
      host.appendChild(b);
    }
  })();

  /* ══ اللغة. والبيتُ يبقى عربيًّا دائمًا: هو الأثرُ لا الترجمة ══ */
  /* مصراعان، كلٌّ في سطره كما يُكتب البيت. والعجزُ لا يُلحَق بالصدر
     فيتيتّم آخرُه في سطرٍ وحدَه. */
  var BAYT = '<span>وإنَّ لِساناً لم تُعِنْهُ <mark>لُبابةٌ</mark></span>'
           + '<span>كحاطبِ ليلٍ يجمعُ الرَّذْلَ حاطبُهْ</span>';
  var AR = {
    t:'لُب — LOBE', wm:'لُب', btn:'EN', alt:'English', cr:'لُب', swl:'اللون',
    say:'<span class="lead">نُعيد الإنسانَ إلى لُبّه، إلى عقله.</span> '
       + '<span class="rest">ونُعيد صياغةَ علاقته بالتقنية ليصير منتجًا لا مستهلكًا.</span>',
    capA:'ثلاثُ دوائرَ بنصفِ قطرٍ واحد', capB:'r = ٥٤٫٢٥',
    cite:'ابن الدُّمَينة', gloss:'', lab:'المنصّات الثلاث',
    mark:'المعلَم', derive:'مشتقٌّ من لُب',
    cols:[['أكاديميا','منصّةُ العلم','الحال','قريبًا'],
          ['أجندا','منصّةُ العمل','الحال','قريبًا'],
          ['أثينا','منصّةُ القراءة','الحال','قريبًا']]
  };
  var EN = {
    t:'LOBE — لُب', wm:'LOBE', btn:'ع', alt:'العربيّة', cr:'LOBE', swl:'ACCENT',
    say:'<span class="lead">We return people to their core — to their mind.</span> '
       + '<span class="rest">And reshape their relationship with technology, so they become producers, not consumers.</span>',
    capA:'THREE CIRCLES, ONE RADIUS', capB:'r = 54.25',
    cite:'Ibn al-Dumayna',
    gloss:'A tongue unaided by <em>lubāba</em> — the kernel of the mind — gathers firewood by night, and hauls home whatever is worthless.',
    lab:'THE THREE PLATFORMS', mark:'Mark', derive:'Derived from LOBE',
    cols:[['Academia','The platform for knowledge','Status','Soon'],
          ['Agenda','The platform for work','Status','Soon'],
          ['Athena','The platform for reading','Status','Soon']]
  };
  function el(id){ return document.getElementById(id); }
  function set(lang, remember){
    var isAr = lang !== 'en', D = isAr ? AR : EN, i, h = '';
    document.documentElement.lang = isAr ? 'ar' : 'en';
    document.documentElement.dir  = isAr ? 'rtl' : 'ltr';
    document.title = D.t;
    el('wm').textContent = D.wm; el('cr').textContent = D.cr; el('swl').textContent = D.swl;
    el('lang').textContent = D.btn; el('lang').setAttribute('aria-label', D.alt);
    el('say').innerHTML = D.say;
    el('capA').textContent = D.capA; el('capB').textContent = D.capB;
    el('verse').innerHTML = BAYT; el('cite').textContent = D.cite;
    if (D.gloss){ el('gloss').innerHTML = D.gloss; el('gloss').removeAttribute('hidden'); }
    else el('gloss').setAttribute('hidden','');
    el('lab').textContent = D.lab;
    for (i = 0; i < D.cols.length; i++){
      h += '<article class="col"><h2>' + D.cols[i][0] + '</h2><p>' + D.cols[i][1] + '</p>'
         + '<div class="row"><span>' + D.cols[i][2] + '</span><b>' + D.cols[i][3] + '</b></div>'
         + '<div class="row"><span>' + D.mark + '</span><span class="go">' + D.derive + ' ↗</span></div>'
         + '</article>';
    }
    el('cols').innerHTML = h;
    if (remember){ try { localStorage.setItem('lobe-lang', isAr ? 'ar' : 'en'); } catch (e) {} }
  }
  var sv = null, sa = null;
  try { sv = localStorage.getItem('lobe-lang'); sa = localStorage.getItem('lobe-acc'); } catch (e) {}
  set(sv === 'en' ? 'en' : 'ar', false);
  applyAcc(sa !== null && ACC[+sa] ? +sa : 0, false);
  el('lang').addEventListener('click', function(){
    set(document.documentElement.lang === 'ar' ? 'en' : 'ar', true);
  });

  /* لا تُكشف الصفحةُ قبل وصول خطّها، والمهلةُ حارسٌ عند تعذُّره */
  var shown = false;
  function reveal(){
    if (shown) return;
    shown = true;
    document.body.classList.add('ready');
    T0 = -1; start();
  }
  loadField(function(){ if (document.body.classList.contains('ready')) T0 = -1; start(); });
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(reveal, reveal);
    setTimeout(reveal, 2500);
  } else { setTimeout(reveal, 200); }
})();
</script>
</body>
</html>
